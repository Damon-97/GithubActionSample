name: QQ装机价格推送

on:
  schedule:
    - cron: "30 3 * * *" # UTC 03:30，北京时间 11:30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install CJK font
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Push PC part prices to QQ
      run: python qq_pc_price_push.py
      env:
        QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
        QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
        QQ_GROUP_OPENID: ${{ secrets.QQ_GROUP_OPENID }}
